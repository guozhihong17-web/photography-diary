<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理后台 — 摄影日记</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div class="admin-page" id="app" style="display:none;">

    <!-- 顶部 -->
    <header class="admin-header">
      <div class="admin-header-inner">
        <h2>📷 管理后台</h2>
        <div style="display:flex;gap:12px;align-items:center;">
          <a href="/" class="btn btn-outline btn-sm">查看网站</a>
          <button class="btn btn-outline btn-sm" id="logoutBtn">退出</button>
        </div>
      </div>
    </header>

    <div class="admin-content">

      <!-- 上传区域 -->
      <section class="upload-section">
        <h3 class="section-title">上传照片</h3>
        <div class="drop-zone" id="dropZone">
          <div class="icon">📤</div>
          <p>拖拽照片到此处，或点击选择文件</p>
          <p class="hint">支持 JPG、PNG、WebP 格式，单文件最大 50MB，最多 20 张</p>
          <input type="file" id="fileInput" multiple accept="image/jpeg,image/png,image/webp" style="display:none;">
        </div>

        <div class="upload-preview" id="uploadPreview" style="display:none;">
          <div class="preview-grid" id="previewGrid"></div>
          <div class="upload-actions">
            <button class="btn btn-primary" id="uploadBtn">开始上传</button>
            <button class="btn btn-outline" id="clearUploadBtn">清空</button>
          </div>
        </div>
        <div id="uploadProgress" style="margin-top:12px;"></div>
      </section>

      <!-- 管理区域 -->
      <section>
        <h3 class="section-title">管理照片 (<span id="photoCount">0</span>)</h3>
        <div class="manage-grid" id="manageGrid"></div>
        <div class="empty-state" id="manageEmpty" style="display:none;padding:40px;">
          <p style="color:var(--text-muted);">还没有上传任何照片</p>
        </div>
        <div class="loading" id="manageLoading">
          <div class="spinner"></div>
        </div>
      </section>

    </div>
  </div>

  <!-- 未登录覆盖层 -->
  <div class="login-page" id="loginOverlay">
    <div class="login-card">
      <h2>📷 管理登录</h2>
      <p class="sub">请输入管理密码</p>
      <form id="loginForm">
        <div class="form-group">
          <label for="loginPassword">管理密码</label>
          <input type="password" id="loginPassword" class="form-input" placeholder="请输入管理密码" required autofocus>
        </div>
        <p class="error-msg" id="loginError">密码错误，请重试</p>
        <button type="submit" class="btn btn-primary btn-block" style="margin-top:8px;">登 录</button>
      </form>
      <a href="/" style="display:inline-block;margin-top:20px;color:var(--text-muted);font-size:0.85rem;">← 返回首页</a>
    </div>
  </div>

  <!-- 编辑弹窗 -->
  <div class="modal-overlay" id="editModal">
    <div class="modal">
      <h3>编辑照片信息</h3>
      <form id="editForm">
        <div class="form-group">
          <label>标题</label>
          <input type="text" id="editTitle" class="form-input">
        </div>
        <div class="form-group">
          <label>描述</label>
          <textarea id="editDesc" class="form-input" rows="3"></textarea>
        </div>
        <div class="form-group">
          <label>分类</label>
          <input type="text" id="editCategory" class="form-input" placeholder="如：风景、人像、街拍...">
        </div>
        <div class="modal-actions">
          <button type="submit" class="btn btn-primary">保存</button>
          <button type="button" class="btn btn-outline" id="cancelEditBtn">取消</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast 容器 -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="/js/admin.js"></script>
</body>
</html>
