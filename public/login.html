<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理登录 — 摄影日记</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <div class="login-page">
    <div class="login-card">
      <h2>📷 管理登录</h2>
      <p class="sub">请输入密码以进入后台管理</p>
      <form id="loginForm">
        <div class="form-group">
          <label for="password">管理密码</label>
          <input type="password" id="password" class="form-input" placeholder="请输入管理密码" required autofocus>
        </div>
        <p class="error-msg" id="errorMsg">密码错误，请重试</p>
        <button type="submit" class="btn btn-primary btn-block" style="margin-top:8px;">登 录</button>
      </form>
      <a href="/" style="display:inline-block;margin-top:20px;color:var(--text-muted);font-size:0.85rem;">← 返回首页</a>
    </div>
  </div>

  <script src="/js/login.js"></script>
</body>
</html>
